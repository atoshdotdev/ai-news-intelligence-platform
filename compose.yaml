services:
  api:
    build:
      context: ./backend
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["fastapi", "dev", "--host", "0.0.0.0", "src/api/main.py"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/pyproject.toml

  web:
    build:
      context: ./frontend
    container_name: web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ./frontend/package.json

  db:
    image: pgvector/pgvector:pg18
    container_name: db
    volumes:
      - db_data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ollama:
  #   image: ollama/ollama:0.13.0
  #   container_name: ollama
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:11434:11434"
  #   volumes:
  #     - ollama:/root/.ollama

volumes:
  db_data:
  ollama:
