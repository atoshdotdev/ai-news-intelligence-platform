  worker2:
    build:
      context: ./backend
      args:
        UV_GROUP: processing
    container_name: ainews-processing-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    command: ["uv", "run", "python", "-m", "ainews.workers.processor.main"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - huggingface_cache:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv
            - alembic
        - action: rebuild
          path: ./backend/pyproject.toml

  db:
    image: pgvector/pgvector:pg18
    container_name: ainews-db
    volumes:
      - db_data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.30.3
    container_name: ainews-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  db_data:
  ollama:
  huggingface_cache:
