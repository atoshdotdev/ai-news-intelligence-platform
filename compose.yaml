services:
  api:
    build:
      context: ./backend
      args:
        UV_GROUP: api
    container_name: ainews-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: ["uv", "run", "fastapi", "dev", "--host", "0.0.0.0"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./backend/alembic:/app/alembic
      - huggingface_cache:/cache/huggingface
    environment:
      HF_HOME: /cache/huggingface
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv
            - alembic
        - action: rebuild
          path: ./backend/pyproject.toml

  web:
    build:
      context: ./frontend
    container_name: ainews-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules
            - .next
        - action: rebuild
          path: ./frontend/package.json

